{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 850px;">
  <div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;">COLLEGE ADMISSION APPLICATION</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your academic and personal information to generate an entrance hall ticket.</p>
  </div>

  <div class="form-card">
    <div class="ticket-badge" style="border-color: #0284c7; color: #0284c7;">ADMISSION 2026</div>
    <form action="{{ url_for('apply') }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>CANDIDATE FULL NAME</label>
          <input type="text" name="student_name" value="{{ session.get('username') }}" required>
        </div>

        <div class="form-group">
          <label>DATE OF BIRTH</label>
          <input type="date" name="dob" required style="color-scheme: light;">
        </div>

        <div class="form-group">
          <label>GENDER</label>
          <select name="gender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>COURSE APPLIED FOR</label>
          <select name="course" required>
            <option value="">Select program</option>
            <option value="B.Tech (CSE)">B.Tech (CSE)</option>
            <option value="B.Tech (AIML)">B.Tech (AIML)</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="B.Sc (Data Science)">B.Sc (Data Science)</option>
            <option value="MBA">MBA</option>
          </select>
        </div>

        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" name="email" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label>MOBILE NUMBER</label>
          <input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>
      </div>

      <div style="margin-top: 2rem; display: flex; align-items: center; gap: 1.5rem;">
        <button type="submit" class="btn-submit">Submit Application</button>
        <span style="font-size: 0.8rem; color: #64748b;">An application reference ID will be generated upon submission.</span>
      </div>
    </form>
  </div>
</div>
{% endblock %}
